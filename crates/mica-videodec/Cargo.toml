[package]
name = "mica-videodec"
description = "H.264 decoding with the operating system's decoder (VideoToolbox, Media Foundation, GStreamer) for Mica Slicer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
openh264 = { version = "=0.9.9", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFBase", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "objc2", "CMBase", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "objc2", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-video-toolbox = { version = "0.3.2", default-features = false, features = ["std", "objc2", "block2", "objc2-core-media", "objc2-core-video", "VTBase", "VTDecompressionSession", "VTErrors"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Variant"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
gstreamer = "0.25.4"
gstreamer-app = "0.25.2"
gstreamer-video = "0.25.4"

[features]
# Development only: decode with OpenH264 compiled from source instead of the operating
# system's decoder. Never enabled in packaged builds (H.264 patent licensing).
openh264 = ["dep:openh264"]

# Not covered by the workspace `unsafe_code = "forbid"`: this is the one crate that calls the
# operating system decoders. Every unsafe block carries a SAFETY comment.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
