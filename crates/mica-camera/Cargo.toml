[package]
name = "mica-camera"
description = "Printer camera players (MJPEG, snapshots, RTSP/H.264, camera-streamer WebRTC) for Mica Slicer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
futures-util = { version = "0.3.34", default-features = false }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
mica-videodec = { path = "../mica-videodec" }
openh264 = { version = "=0.9.9", optional = true }
retina = { version = "=0.4.21", default-features = false }
serde_json = "1.0.154"
# WebRTC (camera-streamer): str0m without a bundled crypto backend; Mica supplies a pure-Rust
# one (RustCrypto ciphers, dimpl DTLS, the DTLS certificate made with rcgen on ring, which
# rustls already uses), so no second C crypto library is built.
str0m = { version = "=0.24.1", default-features = false }
dimpl = { version = "=0.7.5", default-features = false, features = ["rust-crypto"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
aes = "0.8.4"
aes-gcm = "0.10.3"
ctr = "0.9.2"
hmac = "0.12.1"
sha1 = "0.10.6"
sha2 = "0.10.9"
time = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1.53.3", default-features = false, features = ["rt", "net", "time"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
url = "2.5.8"

[features]
# Synthetic cameras (test picture, MJPEG framing, an RTSP/H.264 server, a camera-streamer
# WebRTC sender) for the mock printers.
# Without `openh264` the RTSP server streams a recorded clip of the test picture.
mock = []
# Development only, never in packaged builds (H.264 patent licensing): decode RTSP video with
# OpenH264 compiled from source instead of the operating system's decoder, and let the mock
# RTSP server encode its picture live.
openh264 = ["dep:openh264", "mica-videodec/openh264"]

[lints]
workspace = true
