[package]
name = "mica-update"
description = "Mica Slicer's in-app updater: signed update manifests, download, verify, install"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
# Minisign (Ed25519) signature verification, no dependencies of its own.
minisign-verify = "=0.3.0"
base64 = "0.22.1"
semver = "1.0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
# Signs test updates with a throwaway key generated in memory (tests only, never shipped).
minisign = "=0.10.0"

[lints]
workspace = true
