name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Every test that needs fetched data fails instead of skipping (mica-testkit).
  MICA_REQUIRE_FIXTURES: "1"

jobs:
  provenance:
    name: Provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo xtask provenance

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # The xtasks (corpus) build and run the same profile as the tests.
      MICA_PROFILE: fast
      # Shared runners are slower than the developer Mac the 60 s quick budget is set for.
      MICA_CORPUS_QUICK_BUDGET: "300"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # The pinned vendor profiles the tests slice with (upstream/UPSTREAM.lock): the Prusa
      # profiles repository and only resources/profiles of OrcaSlicer and Snapmaker Orca
      # (sparse checkouts, ~330 MB in all). Cached until the lock or the fetch script changes.
      - name: Cache pinned upstream data
        uses: actions/cache@v4
        with:
          path: |
            upstream/prusa-profiles
            upstream/orca
            upstream/snapmaker-orca
          key: upstream-profiles-${{ runner.os }}-${{ hashFiles('upstream/UPSTREAM.lock', 'scripts/fetch-upstream.sh') }}
      - name: Fetch pinned upstream data
        shell: bash
        run: scripts/fetch-upstream.sh --profiles prusa-profiles orca snapmaker-orca
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      # The `fast` profile: release code generation (the same G-code) without LTO. It runs the
      # slicing tests quickly and includes the 3DBenchy reference hashes, which debug skips.
      # The hashes themselves are asserted on macOS arm64, where they are recorded.
      - name: Tests (incl. reference hashes)
        run: cargo test --workspace --locked --profile fast
      # The quick regression corpus (tests/corpus/run.py; os.wait4 is POSIX only).
      - name: Quick corpus
        if: runner.os != 'Windows'
        run: cargo xtask corpus --quick
      - name: Corpus report
        if: always() && runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: corpus-report-${{ matrix.os }}
          path: out/corpus-report.md
          if-no-files-found: ignore
